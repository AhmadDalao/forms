# Adapt paths/domain and TLS certificate settings before enabling this vhost.
# For PHP-FPM, set the two env values in the FPM pool instead of relying on SetEnv.
<VirtualHost *:443>
    ServerName forms.example.com
    DocumentRoot /srv/alnaeem/public
    SSLEngine on
    SSLCertificateFile /path/to/fullchain.pem
    SSLCertificateKeyFile /path/to/privkey.pem
    SetEnv FORMS_DATA_DIR /srv/alnaeem/private/management
    SetEnv FORMS_PORTAL_DATA_DIR /srv/alnaeem/private/portal
    <Directory /srv/alnaeem/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /srv/alnaeem/private>
        Require all denied
    </Directory>
    # Use the system's configured PHP 8.3+ mod_php/FPM handler.
    ErrorLog /var/log/apache2/alnaeem-error.log
    CustomLog /var/log/apache2/alnaeem-access.log combined
</VirtualHost>
